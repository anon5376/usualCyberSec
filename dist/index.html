<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f8fb">
  <meta name="description" content="Free, open-source tools to preserve evidence and respond to suspected deepfakes, impersonation, suspicious links, and security incidents. Your evidence stays on your device.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>usualCyberSec — Digital safety workspace</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.mjs"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to workspace</a>
  <div class="shell">
    <header class="sidebar">
      <a class="brand" href="#overview" aria-label="usualCyberSec home">usualCyberSec</a>
      <nav id="navigation" aria-label="Main navigation"></nav>
      <div class="header-actions"><a href="https://github.com/anon5376/usualCyberSec" target="_blank" rel="noopener noreferrer" class="source-link">GitHub</a><a href="#vault" class="save-shortcut">Save data</a></div>
    </header>
    <div class="workspace">
      <div class="topbar"><span id="route-label" class="visually-hidden">Start</span><span class="storage-state" id="storage-state">Session only</span></div>
      <main id="main" tabindex="-1"></main>
      <footer class="footer"><span>usualCyberSec · Free and open source</span><a href="#library">Methods & limitations</a><a href="#vault">Privacy & data</a><a href="./usualcybersec-source.zip" download>Download source</a></footer>
    </div>
  </div>
  <div id="notice" class="toast" role="status" aria-live="polite" hidden></div>
  <noscript><p class="noscript">usualCyberSec needs JavaScript to run its on-device tools. No evidence is uploaded.</p></noscript>
</body>
</html>
